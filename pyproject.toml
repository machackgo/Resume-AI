[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-ai-showcase"
version = "0.1.0"
description = "Evidence-grounded job-application assistant: scoped hybrid RAG, explainable job matching, claim validation and an approval-gated tracker."
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1"]

[project.optional-dependencies]
test = ["pytest>=8"]
minilm = ["torch", "transformers"]

[tool.setuptools.packages.find]
include = ["resume_ai*"]

[tool.setuptools.package-data]
"resume_ai.rag" = ["fixtures/*.md", "fixtures/*.json"]
"resume_ai.rag.reasoning" = ["*.json", "*.txt"]
"resume_ai.rag.vectorstore" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
